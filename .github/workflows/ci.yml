name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Verify module
        run: bash ./scripts/verify-all.sh

      - name: Verify external consumer
        run: bash ./scripts/verify-external-consumer.sh

  memory-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg16-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: memorykit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d memorykit_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MEMORYKIT_REQUIRE_POSTGRES: "1"
      MEMORYKIT_POSTGRES_TEST_DSN: postgres://postgres:postgres@localhost:5432/memorykit_test?sslmode=disable
      RUNKIT_POSTGRES_TEST_DSN: postgres://postgres:postgres@localhost:5432/memorykit_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go test -race -p 1 ./memorykit/... ./runkit/...
      - run: go test -race -run '^TestHostMemoryPostgresBlackBox$' ./examples/host-api
